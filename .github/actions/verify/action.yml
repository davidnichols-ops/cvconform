name: 'cvconform verify'
description: 'Differential conformance check: is this still the same model? Install, verify, and report.'
author: 'cvconform'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  model:
    description: 'Path to the model artifact (.pt/.onnx/.mlmodel) to verify. Omit to auto-discover from the repo.'
    required: false
    default: ''
  reference:
    description: 'Reference runtime (pytorch, onnx, coreml).'
    required: false
    default: 'pytorch'
  targets:
    description: 'Comma-separated target runtimes (onnx,coreml,...).'
    required: false
    default: ''
  args:
    description: 'Extra arguments to pass to cvconform verify.'
    required: false
    default: ''
  comment:
    description: 'Whether to post a PR comment with the conformance summary.'
    required: false
    default: 'true'

outputs:
  report_path:
    description: 'Path to the machine-readable JSON report.'
    value: ${{ steps.verify.outputs.report_path }}
  conformant:
    description: '"true" if all targets are conformant, else "false".'
    value: ${{ steps.verify.outputs.conformant }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install cvconform (cached wheels)
      shell: bash
      run: |
        # Prefer installed; fall back to the checkout's local wheel if building.
        python -m pip install --quiet --upgrade pip
        if [ -f pyproject.toml ]; then
          python -m pip install --quiet -e .[pytorch] 2>/dev/null || true
        fi
        python -m pip install --quiet cvconform 2>/dev/null || echo "note: cvconform not on PyPI yet; using local checkout"

    - name: Verify conformance
      id: verify
      shell: bash
      run: |
        ARGS="${{ inputs.args }}"
        MODEL=""
        if [ -n "${{ inputs.model }}" ]; then MODEL="${{ github.workspace }}/${{ inputs.model }}"; fi
        TARGETS=""
        if [ -n "${{ inputs.targets }}" ]; then TARGETS="--targets ${{ inputs.targets }}"; fi

        REPORT="$RUNNER_TEMP/cvconform-report.json"
        # best-effort baseline: verify runs, captures report, and exit code
        set +e
        python -m cvconform.cli verify $MODEL --reference "${{ inputs.reference }}" \
            $TARGETS --json "$REPORT" $ARGS
        RC=$?
        set -e

        CONFORMANT=false
        if [ -f "$REPORT" ]; then
          if python - "$REPORT" <<'PY'
import json,sys
r=json.load(open(sys.argv[1]))
sys.exit(0 if all(s=="conformant" for s in r.get("target_status",{}).values()) else 1)
PY
          then CONFORMANT=true; fi
        fi

        echo "report_path=$REPORT" >> "$GITHUB_OUTPUT"
        echo "conformant=$CONFORMANT" >> "$GITHUB_OUTPUT"
        if [ "$CONFORMANT" = "false" ]; then
          echo "::error::cvconform: one or more runtimes diverged from the reference model"
        else
          echo "::notice::cvconform: all runtimes conformant"
        fi
        exit $RC

    - name: Attach report artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cvconform-report
        path: ${{ steps.verify.outputs.report_path }}

    - name: Post PR comment (summary + badge)
      if: github.event_name == 'pull_request' && inputs.comment == 'true'
      shell: bash
      run: |
        REPORT="${{ steps.verify.outputs.report_path }}"
        if [ ! -f "$REPORT" ]; then
          echo "::warning::cvconform report not found; skipping comment"
          exit 0
        fi
        python - "$REPORT" "${{ runner.os }}" <<'PY'
import json, os, sys
r = json.load(open(sys.argv[1]))
os_name = sys.argv[2]
conformant = all(s == "conformant" for s in r.get("target_status", {}).values())
badge = ":white_check_mark:" if conformant else ":x:"
lines = [f"## cvconform conformance ({os_name}) {badge}"]
for t, status in (r.get("target_status") or {}).items():
    score = (r.get("targets", {}).get(t) or {}).get("overall_score", 0.0)
    lines.append(f"- **{t}**: {score:.2f}% · {status}")
if not conformant:
    lines.append("\n### Findings")
    for f in r.get("findings", []):
        lines.append(f"- `{f.get('backend')}` · {f.get('cause')} (conf {f.get('confidence')})")
body = "\n".join(lines)
# write to a footer file that a follow-up step can comment (no GITHUB_TOKEN here)
open(os.path.join(os.path.dirname(r"""${{ github.workspace }}"""), "cvconform-pr-body.md"), "w").write(body)
print("PR comment body prepared in cvconform-pr-body.md")
PY
