name: cvconform

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            targets: onnx
          - os: macos-latest
            targets: onnx,coreml
          - os: windows-latest
            targets: onnx
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/verify
        with:
          # Omit model -> auto-discover from repo; or point at one:
          # model: yolo11.pt
          reference: pytorch
          targets: ${{ matrix.targets }}
          args: --require-conformant
          comment: 'true'
