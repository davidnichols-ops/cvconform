name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-14
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system OpenMP (for torch on macOS)
        run: brew install libomp || true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          # Install the local checkout with the optional runtimes needed for the demo + tests.
          pip install -e ".[core,pytorch,coreml]"

      - name: Generate demo artifacts
        run: |
          python examples/demo_model.py
        env:
          KMP_DUPLICATE_LIB_OK: "TRUE"

      - name: Run tests
        run: |
          python -m pytest -q
        env:
          KMP_DUPLICATE_LIB_OK: "TRUE"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install ruff
      - name: Ruff check
        run: ruff check cvconform tests || true
